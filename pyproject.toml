[project]
name = "agent"
version = "0.1.0"
description = "An agentic AI system built on DeepAgents and LangChain"
readme = "README.md"
authors = [
    { name = "ar-sdadras", email = "alireza.s.dadras@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.1",
    "python-dotenv>=1.1.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
