[project]
name = "agent"
version = "0.1.0"
description = "An agentic AI system built on DeepAgents and LangChain"
readme = "README.md"
authors = [
    { name = "ar-sdadras", email = "alireza.s.dadras@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.1",
    "python-dotenv>=1.1.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "ipykernel>=7.3.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.2",
    "langchain-chroma>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "core/src"

[tool.setuptools.packages.find]
where = ["core/src", "core", "alireza"]
include = ["*"]
exclude = ["tests*", "notebooks*", "src*"]





[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["core/src", "core/configs", "core/agents", "core/apps", "alireza", "alireza/py_files", "."]

[tool.pyrefly]
search-path = ["core/src", "core", "alireza", "alireza/py_files"]


