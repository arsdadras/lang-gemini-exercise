name: Messages

# Makes coordination visible without anyone asking (ADR-0020): on every pull request, the
# messages it adds or changes and any file outside its branch's role; on every push to main,
# the open messages waiting for each role. Reports only; it never fails a run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: messages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Pull request report
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/pr_report.py --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Open messages on main
        if: github.event_name == 'push'
        run: python3 scripts/pr_report.py --summary >> "$GITHUB_STEP_SUMMARY"
